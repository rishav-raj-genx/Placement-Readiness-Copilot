name: Automation Worker (Job Discovery & Link Check)

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      skills:
        description: 'Candidate skills to search for (comma-separated)'
        required: false
        default: 'React, Node.js, Python, TypeScript, Java'
      role:
        description: 'Target Role'
        required: false
        default: 'Software Engineer'
      limit:
        description: 'Maximum jobs to discover per role search'
        required: false
        default: '30'

jobs:
  run-automation:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
      HEADLESS_BROWSER: 'true'
      AUTOMATION_E2E_MODE: 'false'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './automation-and-job-discovery/requirements.txt'

      - name: 📦 Install Python dependencies
        working-directory: ./automation-and-job-discovery
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Job Discovery Pipeline (Greenhouse, Lever & RSS)
        working-directory: ./automation-and-job-discovery
        run: |
          SKILLS="${{ github.event.inputs.skills || 'React, TypeScript, Python, Node.js' }}"
          ROLE="${{ github.event.inputs.role || 'Software Engineer' }}"
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          echo "Running Job Discovery for: Skills='$SKILLS', Role='$ROLE', Limit='$LIMIT'"
          python run.py discover-jobs --skills "$SKILLS" --role "$ROLE" --limit "$LIMIT"
          # Also discover targeted junior / intern roles to ensure student opportunities are populated
          python run.py discover-jobs --skills "Python, FastAPI, Django, SQL" --role "Backend Engineer" --limit 20
          python run.py discover-jobs --skills "React, TypeScript, Next.js, CSS" --role "Frontend Engineer" --limit 20

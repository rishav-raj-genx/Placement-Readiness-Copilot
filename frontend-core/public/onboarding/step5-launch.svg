<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#28201E"/>
      <stop offset="100%" stopColor="#1a1310"/>
    </linearGradient>
    <linearGradient id="l-lava" x1="16" y1="12" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#D93829"/>
      <stop offset="50%" stopColor="#EA580C"/>
      <stop offset="100%" stopColor="#F59E0B"/>
    </linearGradient>
    <linearGradient id="l-trail" x1="32" y1="42" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B"/>

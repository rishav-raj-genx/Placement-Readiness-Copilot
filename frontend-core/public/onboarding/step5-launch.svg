    </linearGradient>
  </defs>
  <!-- Background badge rounded squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#l-bg)" stroke="#382D2A" stroke-width="2"/>

  <!-- Rocket Ship -->
  <!-- Exhaust flames -->
  <path d="M28 44C28 44 32 54 32 54C32 54 36 44 36 44" fill="url(#l-trail)" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Rocket Body -->
  <path d="M32 14C27 21 26 31 26 38H38C38 31 37 21 32 14Z" fill="#1a1310" stroke="url(#l-lava)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Rocket Porthole with molten rim -->
  <circle cx="32" cy="27" r="4" fill="#28201E" stroke="#EA580C" stroke-width="1.8"/>
  <circle cx="32" cy="27" r="1.5" fill="#F59E0B"/>

  <!-- Left Fin -->

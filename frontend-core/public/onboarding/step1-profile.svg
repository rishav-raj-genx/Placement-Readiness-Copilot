<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#28201E"/>
      <stop offset="100%" stopColor="#1a1310"/>
    </linearGradient>
    <linearGradient id="p-lava" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#D93829"/>
      <stop offset="100%" stopColor="#EA580C"/>
    </linearGradient>
    <linearGradient id="p-amber" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#EA580C"/>
      <stop offset="100%" stopColor="#F59E0B"/>
    </linearGradient>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background badge rounded squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#p-bg)" stroke="#382D2A" stroke-width="2"/>
  
  <!-- Subtle ambient glow -->
  <circle cx="32" cy="32" r="16" fill="#D93829" opacity="0.15" filter="url(#p-glow)"/>

  <!-- Resume Document icon with folded corner -->
  <path d="M22 16H36L44 24V46C44 47.1 43.1 48 42 48H22C20.9 48 20 47.1 20 46V18C20 16.9 20.9 16 22 16Z" fill="#28201E" stroke="url(#p-lava)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 16V24H44" stroke="url(#p-lava)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text lines inside resume -->
  <line x1="25" y1="28" x2="33" y2="28" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="34" x2="39" y2="34" stroke="url(#p-amber)" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="40" x2="35" y2="40" stroke="url(#p-amber)" stroke-width="2" stroke-linecap="round"/>

  <!-- ATS checkmark emblem in bottom-right -->
  <circle cx="44" cy="44" r="8" fill="#1a1310" stroke="#D93829" stroke-width="1.5"/>
  <path d="M41 44L43 46L47 42" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

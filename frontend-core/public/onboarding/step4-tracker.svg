<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#28201E"/>
      <stop offset="100%" stopColor="#1a1310"/>
    </linearGradient>
    <linearGradient id="t-amber" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#EA580C"/>
    </linearGradient>
    <linearGradient id="t-lava" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#EA580C"/>
      <stop offset="100%" stopColor="#D93829"/>
    </linearGradient>
  </defs>
  <!-- Background badge rounded squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#t-bg)" stroke="#382D2A" stroke-width="2"/>

  <!-- Kanban board columns -->
  <!-- Column 1 -->
  <rect x="15" y="16" width="9" height="32" rx="3" fill="#1a1310" stroke="#382D2A" stroke-width="1.5"/>
  <rect x="17" y="20" width="5" height="7" rx="1.5" fill="#382D2A"/>
  <rect x="17" y="30" width="5" height="10" rx="1.5" fill="#382D2A"/>

  <!-- Column 2 (Active/Shortlisted with Ember gradient) -->
  <rect x="27" y="16" width="10" height="32" rx="3" fill="#28201E" stroke="url(#t-amber)" stroke-width="2"/>
  <rect x="29" y="20" width="6" height="9" rx="1.5" fill="url(#t-amber)"/>
  <rect x="29" y="32" width="6" height="7" rx="1.5" fill="#EA580C"/>

  <!-- Column 3 (Offer column with Lava gradient) -->
  <rect x="40" y="16" width="9" height="32" rx="3" fill="#1a1310" stroke="url(#t-lava)" stroke-width="1.5"/>
  <rect x="42" y="20" width="5" height="12" rx="1.5" fill="url(#t-lava)"/>
  
  <!-- Briefcase icon badge in bottom corner -->
  <circle cx="46" cy="44" r="8" fill="#28201E" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="42" y="42" width="8" height="5" rx="1" fill="#1a1310" stroke="#F59E0B" stroke-width="1"/>
  <path d="M44 42V40C44 39.5 44.5 39 45 39H47C47.5 39 48 39.5 48 40V42" stroke="#F59E0B" stroke-width="1"/>
</svg>

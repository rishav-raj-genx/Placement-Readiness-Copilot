<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="r-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#28201E"/>
      <stop offset="100%" stopColor="#1a1310"/>
    </linearGradient>
    <linearGradient id="r-lava" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#EA580C"/>
      <stop offset="100%" stopColor="#D93829"/>
    </linearGradient>
    <linearGradient id="r-amber" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Background badge rounded squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#r-bg)" stroke="#382D2A" stroke-width="2"/>

  <!-- Target crosshairs / calibration dial -->
  <circle cx="32" cy="32" r="18" stroke="#382D2A" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="13" stroke="url(#r-lava)" stroke-width="2"/>
  <circle cx="32" cy="32" r="7" fill="url(#r-amber)" stroke="#D93829" stroke-width="1.5"/>

  <!-- Crosshair axes with tick marks -->
  <line x1="32" y1="10" x2="32" y2="16" stroke="url(#r-amber)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="32" y2="54" stroke="url(#r-amber)" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="16" y2="32" stroke="url(#r-amber)" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="54" y2="32" stroke="url(#r-amber)" stroke-width="2" stroke-linecap="round"/>

  <!-- Central bullseye dot -->
  <circle cx="32" cy="32" r="2.5" fill="#1a1310"/>
</svg>

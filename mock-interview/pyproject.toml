[project]
name = "mock-interview-service"
version = "1.0.0"
description = "Resume-grounded LiveKit and FastAPI mock interview service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.100,<1.0",
  "pydantic>=2.0,<3.0",
  "pyjwt>=2.8,<3.0",
  "pypdf>=6.21.1",
  "uvicorn>=0.20,<1.0",
  "websockets>=15.0,<16.0",
]

[project.optional-dependencies]
voice = [
  "livekit-agents>=1.4.5,<2.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"agent/__init__.py" = ["N999"]
"scoring/__init__.py" = ["N999"]

[project]
name = "placement-readiness-automation-worker"
version = "1.0.0"
description = "Live-link checks, compliant job discovery, and readiness scoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "feedparser>=6.0.11",
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "supabase>=2.3.0",
    "uvicorn>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
